<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Admin Login - FENU Uganda</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #1A5276;
            --secondary: #F39C12;
            --accent: #2980B9;
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.3);
            --text-main: #333;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Inter', sans-serif;
        }

        .admin-login {
            min-height: 100vh;
            /* Dynamic animated gradient background */
            background: linear-gradient(-45deg, #1A5276, #2980B9, #F39C12, #E67E22);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Ambient floating shapes for extra flair */
        .admin-login::before, .admin-login::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 10s infinite ease-in-out;
        }
        .admin-login::before {
            width: 300px;
            height: 300px;
            top: -100px;
            left: -100px;
            animation-delay: -5s;
        }
        .admin-login::after {
            width: 400px;
            height: 400px;
            bottom: -150px;
            right: -100px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }

        /* Glassmorphism Card */
        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            padding: 3rem;
            width: 100%;
            max-width: 420px;
            z-index: 10;
            color: white;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.3);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .login-header i {
            font-size: 3.5rem;
            color: white;
            margin-bottom: 1rem;
            text-shadow: 0 4px 10px rgba(0,0,0,0.2);
            /* Add subtle pulse animation */
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .login-header h2 {
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            font-weight: 300;
            opacity: 0.9;
        }

        /* Form Controls styling for glass aesthetic */
        .form-control {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white !important;
            border-radius: 12px;
            padding: 0.75rem 1rem;
            transition: all 0.3s ease;
        }
        
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        .form-label {
            font-weight: 500;
            letter-spacing: 0.5px;
            font-size: 0.9rem;
        }

        /* Checkbox styling */
        .form-check-input {
            background-color: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }
        .form-check-input:checked {
            background-color: var(--secondary);
            border-color: var(--secondary);
        }

        /* Beautiful Button */
        .btn-primary {
            background: linear-gradient(135deg, var(--secondary), #d68910);
            border: none;
            border-radius: 12px;
            padding: 0.8rem;
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.3);
            margin-top: 1rem;
            position: relative;
            overflow: hidden;
        }

        /* Shine effect on button */
        .btn-primary::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            transition: all 0.5s ease;
        }

        .btn-primary:hover::after {
            left: 200%;
        }

        .btn-primary:hover, .btn-primary:focus {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(243, 156, 18, 0.5);
            background: linear-gradient(135deg, #e67e22, #d68910);
        }

        #loginMessage {
            border-radius: 10px;
            padding: 10px;
            font-weight: 500;
            background: rgba(255,255,255,0.9);
        }
    </style>
</head>
<body>
    <div class="admin-login">
        <div class="login-card">
            <div class="login-header">
                <i class="fas fa-shield-alt"></i>
                <h2>Admin Portal</h2>
                <p>FENU Uganda Content Management</p>
            </div>

            <form id="adminLoginForm">
                <div class="mb-4">
                    <label for="username" class="form-label"><i class="fas fa-user me-2"></i>Username</label>
                    <input type="text" class="form-control" id="username" placeholder="Enter username" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label"><i class="fas fa-lock me-2"></i>Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">Remember me</label>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="fas fa-sign-in-alt me-2"></i>Login
                </button>
            </form>

            <div id="loginMessage" class="mt-4 text-center" style="display: none;"></div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(document).ready(function() {
            // Check if already logged in
            try {
                if (localStorage.getItem('adminLoggedIn') === 'true') {
                    const loginTime = parseInt(localStorage.getItem('adminLoginTime'));
                    const currentTime = Date.now();
                    const hoursDiff = (currentTime - loginTime) / (1000 * 60 * 60);

                    // Auto logout after 24 hours
                    if (hoursDiff < 24) {
                        window.location.href = 'dashboard.html';
                        return;
                    } else {
                        localStorage.removeItem('adminLoggedIn');
                        localStorage.removeItem('adminLoginTime');
                    }
                }
            } catch (e) {
                console.log('localStorage not accessible:', e);
            }

            $('#adminLoginForm').on('submit', async function(e) {
                e.preventDefault();

                const username = $('#username').val().trim();
                const password = $('#password').val();
                
                // Add loading state to button
                const submitBtn = $(this).find('button[type="submit"]');
                const originalBtnHtml = submitBtn.html();
                submitBtn.html('<i class="fas fa-spinner fa-spin me-2"></i>Authenticating...').prop('disabled', true);

                try {
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ username, password })
                    });

                    const data = await response.json();
                    if (!response.ok) {
                        throw new Error(data.error || 'Invalid credentials');
                    }

                    // Store login status
                    try {
                        localStorage.setItem('adminLoggedIn', 'true');
                        localStorage.setItem('adminLoginTime', Date.now());
                        localStorage.setItem('adminUser', JSON.stringify(data.user || {}));
                    } catch (e) {
                        console.log('localStorage not accessible:', e);
                    }

                    $('#loginMessage').removeClass('text-danger').addClass('text-success')
                        .html('<i class="fas fa-check-circle me-2"></i>Login successful! Redirecting...').slideDown();

                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } catch (error) {
                    submitBtn.html(originalBtnHtml).prop('disabled', false);
                    $('#loginMessage').removeClass('text-success').addClass('text-danger')
                        .html(`<i class="fas fa-exclamation-triangle me-2"></i>${error.message}`).slideDown();
                }
            });
        });
    </script>
</body>
</html>
